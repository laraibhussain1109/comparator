<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d0a">
  <meta name="color-scheme" content="dark">
  <title>NeuroIris · Manual inspection</title>
  <link rel="stylesheet" href="/control.css">
  <script src="/control.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div>
        <div class="brand">Neuro<span>Iris</span></div>
        <p class="eyebrow">MANUAL INSPECTION</p>
      </div>
      <div id="connection" class="connection" data-state="connecting" role="status">
        <span class="connection-dot" aria-hidden="true"></span>
        <span id="connection-label">Connecting</span>
      </div>
    </header>

    <main>
      <section class="context" aria-label="Current inspection on the PC">
        <div class="context-top">
          <span class="section-label">CURRENT PART</span>
          <span id="mode" class="mode">Waiting for PC</span>
        </div>
        <h1 id="part">—</h1>
        <div class="face-row">
          <span class="face-mark" aria-hidden="true">◉</span>
          <span id="face">No face selected</span>
        </div>
        <div class="last-decision">
          <span>Latest decision</span>
          <strong id="last-decision" data-verdict="none">—</strong>
        </div>
      </section>

      <div class="instruction">
        <h2>Inspect the presented face</h2>
        <p>The part and face are selected on the PC.</p>
      </div>

      <div class="verdicts" role="group" aria-label="Record the manual verdict">
        <button class="verdict verdict-ok" type="button" data-verdict="PASS" disabled>
          <span class="verdict-icon" aria-hidden="true">✓</span>
          <span class="verdict-copy"><strong>OK</strong><span>Accept this view</span></span>
          <span class="verdict-arrow" aria-hidden="true">→</span>
        </button>
        <button class="verdict verdict-recheck" type="button" data-verdict="RECHECK" disabled>
          <span class="verdict-icon" aria-hidden="true">↻</span>
          <span class="verdict-copy"><strong>View Recheck</strong><span>Inspect this view again</span></span>
          <span class="verdict-arrow" aria-hidden="true">→</span>
        </button>
        <button class="verdict verdict-ng" type="button" data-verdict="FAIL" disabled>
          <span class="verdict-icon" aria-hidden="true">×</span>
          <span class="verdict-copy"><strong>NG</strong><span>Reject this view</span></span>
          <span class="verdict-arrow" aria-hidden="true">→</span>
        </button>
      </div>

      <section class="feedback" aria-label="Control status">
        <p id="availability" role="status" aria-live="polite">Connecting to the PC…</p>
        <p id="receipt" class="receipt" role="status" aria-live="polite"></p>
        <button id="acknowledge" class="acknowledge" type="button" hidden>Continue after checking PC</button>
      </section>
    </main>

    <footer>
      <span class="footer-line" aria-hidden="true"></span>
      <p>Finalize the part on the PC after recording its required faces.</p>
    </footer>
  </div>
</body>
</html>
