name: Windows training file IO

on:
  push:
    branches: [main, codex/neuroiris-inspection-system]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-path-training:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop and geometry dependencies
        run: python -m pip install -r requirements.txt
      - name: Install CPU PyTorch for real checkpoint file IO
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test long Windows and Unicode paths through training and reload
        run: >-
          python -m pytest -q
          tests/test_windows_paths.py
          tests/test_long_path_training.py
          tests/test_long_path_image_io.py
          tests/test_long_path_config.py
          tests/test_dataset_long_paths.py
          tests/test_dataset_import.py
          tests/test_model_file_io.py
          tests/test_asset_downloads.py
          tests/test_models.py
          tests/test_smoke_training.py
          --junitxml=windows-path-tests.xml
      - name: Start and render the actual interface
        run: python app.py --smoke-test
      - name: Publish readable test failures
        if: failure()
        run: python scripts/report-test-failures.py windows-path-tests.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-path-tests
          path: windows-path-tests.xml
          if-no-files-found: ignore
