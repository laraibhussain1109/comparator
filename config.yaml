paths:
  dataset: ./dataset
  artifacts: ./artifacts
  results: ./inspection_results
  logs: ./logs
camera:
  index: 1
  probe_count: 5
  width: 3840
  height: 2160
# Registration/PatchCore work on a larger canonical image so small casting
# defects are not erased when an 8.3 MP frame is normalized.
image_size: 768
classifier:
  # 224 px reduced a 3840x2160 source by 17x and removed small defects.
  # ConvNeXt is fully convolutional and supports this higher input resolution.
  image_size: 512
  batch_size: 2
  sanity_epochs: 120
  epochs: 30
registration:
  min_confidence: 0.42
  # Avoid a fine warp changing or smoothing the defect presented to PatchCore.
  ecc_enabled: false
  foreground_min_area_ratio: 0.06
golden_bank:
  max_images: 12
patchcore:
  patch_size: 12
  stride: 6
  max_memory_patches: 18000
geometry:
  tolerance_multiplier: 4.0
localization:
  # Preserve small genuine components at the 768 px canonical resolution.
  minimum_defect_area: 40
  morphology_kernel: 3
  merge_distance: 12
temporal:
  window: 5
  confirmation_count: 3
  immediate_critical: true
inspection:
  presence_area_ratio: 0.06
  absence_frames: 4
  save_good_events: false
  save_ng_events: true
visual_change:
  backend: sklearn
  require_tao: false
  tao_command: tao
runtime:
  cuda_device: auto
  log_level: INFO
  random_seed: 42
